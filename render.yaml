services:
  # 1. RoundMate Web Service (FastAPI REST API + Persistent Live WebSocket Gateway)
  # Dynamically runs 2 workers when REDIS_URL is configured; safely falls back to 1 worker in-memory if Redis is not found.
  - type: web
    name: roundmate-backend
    env: python
    region: oregon
    plan: standard
    buildCommand: "pip install -r backend/requirements.txt"
    preDeployCommand: "cd backend && alembic upgrade head"
    startCommand: "sh -c 'WORKERS=${WEB_CONCURRENCY:-$([ -n \"$REDIS_URL\" ] && echo 2 || echo 1)}; cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers $WORKERS --ws websockets'"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: roundmate-db
          property: connectionString
      - key: REDIS_URL
        sync: false # Optional: provide Upstash/Valkey/Redis URL for multi-worker mode; omit for single-worker in-memory fallback
      - key: USE_SPEECHMATICS
        value: "false"
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

# 2. Render Managed PostgreSQL (Durable ACID relational storage + pgvector)
databases:
  - name: roundmate-db
    region: oregon
    plan: standard
    databaseName: roundmate
    user: roundmate_admin
    postgresMajorVersion: 16
