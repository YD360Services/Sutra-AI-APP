name: Backend CI & Contract Verification

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: Unit & Architecture Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pydantic fastapi httpx starlette sqlalchemy aiosqlite "pytest>=8,<10"

      - name: Byte-compile Check (Syntax Validation)
        run: |
          python -m compileall backend/app

      # pytest also runs the unittest.TestCase suites, plus the plain pytest-style
      # test functions that `unittest discover` silently skipped.
      - name: Run Tests (pytest)
        env:
          PYTHONPATH: backend
          # app.db.database builds an engine at import time; tests that need a DB
          # override get_db with their own in-memory SQLite, so this is never written.
          DATABASE_URL: sqlite+aiosqlite:///./ci-test.db
        run: |
          python -m pytest backend/tests -v

