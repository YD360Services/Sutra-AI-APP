name: Backend CI & CD Verification

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: Lint, Security Audit & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Matches PYTHON_VERSION: 3.12.0 in render.yaml
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt "pytest>=8,<10" ruff pip-audit

      - name: Lint Check (ruff)
        run: |
          ruff check backend/app --select E9,F63,F7,F82

      - name: Dependency Security Scan (pip-audit)
        run: |
          pip-audit -r backend/requirements.txt || true

      - name: Byte-compile Check (Syntax Validation)
        run: |
          python -m compileall backend/app

      - name: App Import Check (same as Render startup)
        working-directory: backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-test.db
        run: |
          python -c "import app.main"

      - name: Run Tests (pytest)
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite+aiosqlite:///./ci-test.db
        run: |
          python -m pytest backend/tests -v

  deploy:
    name: Deploy to Render
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not configured in GitHub Secrets; skipping live deploy trigger."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
